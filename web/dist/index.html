<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>LMBY</title>
    <script>
      // 关键：在首屏绘制之前就把主题定下来，避免暗色用户看到一帧白屏（FOUC）。
      // 优先级：用户上次显式选择 > 系统偏好。
      (function () {
        try {
          var saved = localStorage.getItem('lmby-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-B9EA9lTn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DlNJg1ZI.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
