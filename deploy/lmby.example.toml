# LMBY 示例配置
#
# 优先级：内置默认值 < 本文件 < 环境变量（LMBY_*）
# 所有键都可省略，只保留需要改的部分。

# HTTP 监听地址。反代部署时建议 "127.0.0.1:8099"。
listen = ":8099"

# 运行期数据目录（缓存、头像、HLS 分片等）。数据库内容不在这里。
data_dir = "/var/lib/lmby"

# debug | info | warn | error
log_level = "info"

# 对外访问地址，用于生成分享链接（可选）。
# base_url = "https://lmby.example.com"

# 走 HTTPS 时置 true，否则浏览器的 Cookie 加上 Secure 后不会被回传。
secure_cookies = false

# 会话有效期（小时），默认 720（30 天）。
session_ttl_hours = 720

[database]
# 支持 postgres:// URL 或 key=value 形式。
dsn = "postgres://lmby:CHANGE_ME@127.0.0.1:5432/lmby?sslmode=disable"
max_conns = 10
# 启动时自动应用内嵌迁移。
auto_migrate = true

[ffmpeg]
# 留空则用 PATH 里的 ffmpeg。
path = "ffmpeg"
probe_path = "ffprobe"

[images]
# 图片缓存目录，默认 <data_dir>/images。
#   cache/  —— 缩放产物，纯缓存，超过上限按最旧优先清理
#   remote/ —— 本地没有图时从 TMDB 下到的原图（算数据，不参与清理）
# 媒体目录里的本地图只读不写，不在这个目录下。
# cache_dir = "/var/lib/lmby/images"
max_cache_mb = 512

[tasks]# 后台任务队列（探测 / 刮削）的并发 worker 数。
#
# ⚠️ 网络存储上不要贪多：实测同一文件单跑 10 秒，8 路并发能把云盘的随机读
# 拖到 2 分钟以上（互相拖累，总吞吐反而下降）。网盘/SMB 建议 2~4，
# 本地盘可以到 8。
workers = 4

[playback]
# 播放（转封装）参数。
#
# 直出（DirectPlay）不动这些参数：原文件按 HTTP Range 分段送出去，不落盘。
# 下面几项只影响「转封装」（mkv 之类浏览器不认的容器 → HLS fMP4，视频不重编码）。

# HLS 分片目录，默认 <data_dir>/streams。每次播放一个子目录，结束后立刻删除。
# streams_dir = "/var/lib/lmby/streams"

# 单个分片时长（秒），默认 4。短了请求变密，长了起播变慢。
hls_segment_seconds = 4

# 一次预生成多远的媒体内容（秒），默认 300。
#
# 为什么必须限制：转封装是 `-c copy`，比实时快几十倍 —— 不限量的话
# 播一部 2 小时的电影会在几秒内把整部片子拷进数据目录（几十 GB）。
# 窗口用完时播放器会按当前位置续下一段（用户无感）。
# 8 Mbps 的片源下 300 秒约合 300 MB。
hls_window_seconds = 300

# 同时存在的转封装会话上限，默认 4。满了会淘汰最久没人看的会话。
max_sessions = 4

# 无客户端访问后回收会话的秒数，默认 45。
idle_seconds = 45

[tmdb]
# 元数据源。留空也能跑：只是元数据刮削、图片回源与人工匹配不可用
# （扫描、浏览、搜索、播放都不受影响）。
#
# 也可以在 Web 界面「设置」页里填 —— 那里填的值存数据库、**保存即生效（不必重启）**，
# 并且**优先于这个文件**；界面上有「恢复为配置文件的值」可以退回来。
#
# read_token：v4 Read Access Token（推荐）。themoviedb.org → 设置 → API → API Read Access Token
# api_key：v3 API Key，与上面二选一。
read_token = ""
api_key = ""
# 元数据语言；fallback_language 在缺译名时回退。
language = "zh-CN"
fallback_language = "en-US"
