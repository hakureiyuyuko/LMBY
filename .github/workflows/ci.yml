name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 跑在自建 runner 上（PVE 宿主 kyaru 的 LXC 108 = gh-runner-01，自定义 label `lmby`）：
#   * 公开仓库用 GitHub 托管 runner 本身是免费额度，自托管主要是省排队 + 用本地 12 核 i5 跑得更快；
#   * 想临时回退到云端 runner：把下面的 runs-on 换回 ubuntu-latest 即可；
#   * 依赖要求（镜像里已装好）：git/curl/jq/gcc（go test -race 需要 cgo）/gh CLI。
jobs:
  backend:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 自建 runner 上不启用云端缓存：GOMODCACHE（~/go/pkg/mod）本来就在本地持久化，
      # 走 actions/cache 反而多一次 cache service 往返，而且这台 runner 上经常连不通。
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

      - name: go build
        run: go build -trimpath -o /tmp/lmby ./cmd/lmby

      - name: 二进制可用性自检
        run: /tmp/lmby version

  frontend:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: false

      - run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build

  lint:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
