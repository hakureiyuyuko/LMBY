name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # 手动触发：想在某个 ref 上重跑一遍 CI 时用
  workflow_dispatch:

# 跑在自建 runner 上（PVE 宿主上的 LXC 108 = gh-runner-01，自定义 label `lmby`；
# 真实内网坐标见 docs/local-notes.md）：
#   * 公开仓库用 GitHub 托管 runner 本身是免费额度，自托管主要是省排队 + 本地 12 核 i5 跑得快；
#   * 自托管 runner 上 Go/Node 是镜像里预装的（/usr/local），所以 setup-* 步骤被
#     `runner.environment` 守卫跳过 —— 见下面 setup-go 处的说明；
#   * 想临时回退到云端 runner：把 runs-on 换回 ubuntu-latest，setup-* 会自动重新启用；
#   * 镜像依赖：git/curl/jq/gcc+libc6-dev（go test -race 要走 cgo）/gh CLI/Go/Node。
jobs:
  backend:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 自托管 runner 上跳过 setup-go：Go 1.27.1 已在镜像里（/usr/local/go → /usr/local/bin/go）。
      # 实测这台 runner 上 setup-go 会去 GitHub 的 artifact/results 服务（20.209.226.x:443）
      # 拉版本清单/建连接，而那条请求拿到 ESTAB 后不再有任何数据回来 —— 进程 CPU 只用了 1 秒、
      # io 计数冻结、两个 socket 干等，整个 job 卡死在“正在设置 Go”。所以只在云端 runner 上用。
      - uses: actions/setup-go@v7
        if: runner.environment != 'self-hosted'
        with:
          go-version: "1.27"
          cache: true

      - name: Go 版本自检
        run: go version

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

      - name: go build
        run: go build -trimpath -o /tmp/lmby ./cmd/lmby

      - name: 二进制可用性自检
        run: /tmp/lmby version

  frontend:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # 同理跳过 setup-node：Node 24.21.0 已在镜像里（/usr/local/node → /usr/local/bin）
      - uses: actions/setup-node@v7
        if: runner.environment != 'self-hosted'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Node 版本自检
        run: node -v && npm -v

      - run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 构建
        run: npm run build
      # i18n 覆盖率守卫：界面文案必须包 t(...)（中文当源键，漏包就是漏翻）。
      # 管理面已全部翻完，所以预算钉在 0 —— 新增的界面文案没包 t() 会当场失败。
      - name: i18n 覆盖率（必须为 0）
        working-directory: .
        run: node scripts/dev/i18n-coverage.mjs --max 0

  lint:
    runs-on: [self-hosted, lmby]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: runner.environment != 'self-hosted'
        with:
          go-version: "1.27"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
